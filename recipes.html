<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport"content="width=device-width, initial-scale=1.0" />
        <title>Recipes | TastyBite</title>
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>
    <body>
        <header class="site-header">
             <div class="container nav">
      <a href="index.html" class="logo"><span class="logo-mark">TB</span> TastyBite</a>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navLinks">Menu</button>
      <nav class="nav-links" id="navLinks" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="recipes.html" class="active">Recipes</a>
        <a href="index.html#about">About</a>
        <a href="recipes.html" class="btn primary-btn small-btn">Explore Recipes</a>
      </nav>
    </div>
        </header>
         <main>
    <section class="page-head">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a> / Recipes</nav>
        <h1>Explore Our Recipes</h1>
      </div>
    </section>

    <section class="container">
      <form class="toolbar" id="toolbar" role="search">
        <div class="search-row">
          <input type="search" id="searchInput" placeholder="Search recipes by name..." aria-label="Search recipes" />
          <button type="submit" class="btn primary-btn">Search</button>
          <button type="button" class="btn secondary-btn" id="clearBtn">Clear</button>
        </div>
        <div class="filter-row">
          <div class="field">
            <label for="mealFilter">Meal Type</label>
            <select id="mealFilter"><option value="">All meal types</option></select>
          </div>
          <div class="field">
            <label for="cuisineFilter">Cuisine</label>
            <select id="cuisineFilter"><option value="">All cuisines</option></select>
          </div>
          <div class="field">
            <label for="sortSelect">Sort</label>
            <select id="sortSelect">
              <option value="default">Default Order</option>
              <option value="name">Name A-Z</option>
              <option value="rating">Rating: Highest First</option>
            </select>
          </div>
        </div>
      </form>

      <p class="results-count" id="resultsCount" aria-live="polite"></p>
      <div class="recipe-grid" id="recipesGrid">
        <div class="state"><div class="spinner"></div><p>Loading recipes...</p></div>
      </div>
      <div class="pagination" id="pagination"></div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <a href="index.html" class="logo"><span class="logo-mark">TB</span> TastyBite</a>
          <p>A simple recipe website built with HTML, CSS and vanilla JavaScript using real API data.</p>
        </div>
        <div class="footer-links">
          <h4>Quick links</h4>
          <a href="index.html">Home</a>
          <a href="recipes.html">Recipes</a>
          <a href="index.html#about">About</a>
        </div>
      </div>
      <p class="copyright">&copy; <span id="year"></span> TastyBite. All rights reserved.</p>
    </div>
  </footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/recipes.js"></script>

    </body>
</html>
